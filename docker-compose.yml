version: '3.8'

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jwt_auth
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - DB_USER=postgres
      - DB_PASS=postgres
      - DB_NAME=jwt_auth
      - DB_HOST=db
      - JWT_SECRET=your_jwt_secret
    depends_on:
      - db
    volumes:
      - .:/app
    command: npm start

volumes:
  pgdata:
